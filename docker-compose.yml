services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
      - backend_venv:/app/.venv
    depends_on:
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./server
    restart: unless-stopped
    command: ["uv", "run", "--no-sync", "celery", "-A", "config", "worker", "--loglevel=info"]
    env_file:
      - ./server/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    volumes:
      - ./server:/app
      - backend_venv:/app/.venv
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
  backend_venv:
